# Render blueprint for the Karevo API. Secrets are marked sync: false, so
# Render asks for them in the dashboard instead of reading them from this file.
services:
  - type: web
    name: karevo-api
    runtime: node
    region: frankfurt # same region as the Neon database
    plan: starter # the free plan sleeps, which stops the scheduled jobs
    branch: main
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Compiled output only: `nest start` recompiles TypeScript and runs out of memory.
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: NIN_PROVIDER
        value: manual
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ORG_DASHBOARD_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_ADMIN_SECRET
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: BLIND_INDEX_KEY
        sync: false
